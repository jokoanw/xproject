<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verified E-Ticket - Dies Natalis FMIPA 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; }
        .ios-glass-ticket {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.1);
        }
        .ios-ticket-rounded { border-radius: 1.5rem; }
        .ios-divider { height: 1px; background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0) 100%); }
        .mono-text { font-family: 'Space Mono', monospace; }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-hidden bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-50">
    
    <div class="fixed top-[15%] left-[-10%] w-[250px] sm:w-[350px] h-[250px] sm:h-[350px] bg-blue-300 rounded-full mix-blend-multiply filter blur-[80px] sm:blur-[100px] opacity-30"></div>
    <div class="fixed bottom-[15%] right-[-10%] w-[250px] sm:w-[350px] h-[250px] sm:h-[350px] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[80px] sm:blur-[100px] opacity-30"></div>

    <div class="max-w-sm w-full ios-glass-ticket ios-ticket-rounded overflow-hidden relative z-10 mb-16 sm:mb-12">
        
        <div class="p-6 sm:p-8 pb-5 sm:pb-7 flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-5 sm:mb-6">
                <span class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">E-Ticket</span>
                <span class="px-3 py-1.5 bg-slate-100 text-slate-600 text-[9px] sm:text-[10px] font-bold tracking-wider uppercase rounded-full border border-slate-200 text-center">
                    DIESNAT FMIPA UNSOED - MARINE
                </span>
            </div>
            
            <div class="bg-white p-3 sm:p-4 rounded-2xl sm:rounded-3xl shadow-lg mb-5 sm:mb-6 border-2 border-slate-100">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=FMP12-VERIFIED-AFDHI&color=0f172a" alt="QR Code" class="w-40 sm:w-44 h-40 sm:h-44 object-contain rounded-xl">
            </div>
            
            <p class="text-emerald-600 font-semibold tracking-wide flex items-center gap-2 text-base sm:text-lg">
                <span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span></span>
                SIAP DI-SCAN
            </p>
        </div>

        <div class="ios-divider"></div>

        <div class="p-6 sm:p-9 pt-5 sm:pt-7 bg-slate-50/50">
            <div class="space-y-4 sm:space-y-5">
                <div>
                    <p class="text-[10px] sm:text-[11px] text-slate-500 uppercase tracking-widest mb-1 font-medium">Nama Peserta</p>
                    <p class="font-bold text-lg sm:text-xl text-slate-900">Afdhi Abdilah</p>
                </div>
                
                <div class="flex justify-between gap-3">
                    <div>
                        <p class="text-[10px] sm:text-[11px] text-slate-500 uppercase tracking-widest mb-1 font-medium">Program Studi</p>
                        <p class="font-semibold text-sm sm:text-base text-slate-800">Fisika</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] sm:text-[11px] text-slate-500 uppercase tracking-widest mb-1 font-medium">Tipe Tiket</p>
                        <p class="font-semibold text-sm sm:text-base text-slate-800">On-The-Spot</p>
                    </div>
                </div>

                <div class="pt-1 sm:pt-2">
                    <p class="text-[10px] sm:text-[11px] text-slate-500 uppercase tracking-widest mb-1 font-medium">Ticket ID</p>
                    <p class="mono-text text-[11px] sm:text-xs text-slate-600 tracking-[0.2em] font-bold">FMP12-8A9X-21Z</p>
                </div>
            </div>
        </div>
        
    </div>

    <div class="absolute bottom-4 sm:bottom-6 w-full flex flex-col items-center gap-2 sm:gap-3 z-10 px-4">
        <p class="text-xs sm:text-sm text-slate-500 tracking-wide text-center font-medium">Tunjukkan layar ini pada petugas pintu masuk.</p>
        <p class="text-[9px] sm:text-[10px] text-slate-400/80 font-semibold tracking-[0.2em] uppercase text-center">© 2026 ATP Diesnatalis FMIPA. All rights reserved.</p>
    </div>
</body>
</html>
