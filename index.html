<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticket - Dies Natalis FMIPA 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            color: #e2e8f0;
        }
        
        .glass-ticket {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Garis putus-putus ala tiket fisik */
        .ticket-divider {
            border-top: 2px dashed rgba(255, 255, 255, 0.2);
            position: relative;
        }
        
        /* Setengah lingkaran di pinggir divider untuk efek sobekan tiket */
        .ticket-divider::before, .ticket-divider::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 20px;
            height: 20px;
            background-color: #0f172a;
            border-radius: 50%;
        }
        
        .ticket-divider::before {
            left: -30px;
        }
        
        .ticket-divider::after {
            right: -30px;
        }

        .mono-text {
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Ornamen Latar Belakang -->
    <div class="absolute top-[20%] left-[10%] w-72 h-72 bg-indigo-900 rounded-full mix-blend-multiply filter blur-[100px] opacity-40"></div>
    <div class="absolute bottom-[20%] right-[10%] w-72 h-72 bg-slate-700 rounded-full mix-blend-multiply filter blur-[100px] opacity-40"></div>

    <!-- Container Tiket -->
    <div class="max-w-sm w-full glass-ticket rounded-3xl overflow-hidden relative z-10">
        
        <!-- Bagian Atas: Header & QR Code -->
        <div class="p-8 pb-6 flex flex-col items-center">
            <span class="px-3 py-1 bg-white text-slate-900 text-[10px] font-bold tracking-[0.2em] uppercase rounded-full mb-6">
                Verified Access
            </span>
            
            <!-- Kotak QR Code (Placeholder API generik untuk tes visual) -->
            <div class="bg-white p-3 rounded-xl shadow-lg mb-6">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=FMIPA12-AFDHI-FISIKA" alt="QR Code" class="w-40 h-40 object-contain rounded-md">
            </div>
            
            <p class="text-xs text-gray-400 text-center uppercase tracking-widest mb-1">Status Kehadiran</p>
            <p class="text-green-400 font-semibold tracking-wide flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                SIAP DI-SCAN
            </p>
        </div>

        <!-- Garis Pemisah Tiket -->
        <div class="ticket-divider px-8"></div>

        <!-- Bagian Bawah: Detail Peserta -->
        <div class="p-8 pt-6 bg-slate-900/50">
            <div class="space-y-4">
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Nama Peserta</p>
                    <p class="font-semibold text-lg text-white">Afdhi Abdilah</p>
                </div>
                
                <div class="flex justify-between">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Program Studi</p>
                        <p class="font-medium text-gray-200">Fisika</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Tipe Tiket</p>
                        <p class="font-medium text-gray-200">On-The-Spot</p>
                    </div>
                </div>

                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Ticket ID</p>
                    <p class="mono-text text-xs text-gray-400 tracking-widest">#FMP12-8A9X-21Z</p>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Instruksi bawah -->
    <p class="absolute bottom-10 text-xs text-gray-500 tracking-wider text-center w-full">Tunjukkan layar ini ke panitia di pintu masuk</p>
</body>
</html>
