<!-- Script Integrasi Firebase & Logika Form -->
    <script type="module">
        // 1. Mengimpor Modul Firebase dari Google (Versi 10 Terbaru)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
        // =========================================================================
        // 2. TEMPEL KODE FIREBASE ANDA DI SINI
        // Ganti isi variabel firebaseConfig ini dengan kode milik Anda dari Notepad!
        const firebaseConfig = {
            apiKey: "AIzaSyCQvjHFiOZAOZiVDD_-X7v7D0wiYDo3vn8",
  authDomain: "presensi12-79349.firebaseapp.com",
  projectId: "presensi12-79349",
  storageBucket: "presensi12-79349.firebasestorage.app",
  messagingSenderId: "99731054651",
  appId: "1:99731054651:web:77af6714b2b32244963c1e"
        };
        // =========================================================================
  
        // 3. Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
  
        // 4. Fungsi Pembuat ID Tiket Acak (Contoh: FMP12-A8X9)
        function generateTicketID() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'FMP12-';
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
  
        // 5. Eksekusi Saat Tombol Ditekan
        const submitBtn = document.querySelector('button');
        submitBtn.addEventListener('click', async () => {
            // Ambil nilai dari kotak input
            const nama = document.getElementById('nama').value;
            const jurusan = document.getElementById('jurusan').value;
            const email = document.getElementById('email').value;
  
            // Pengecekan jika ada kolom yang kosong
            if(!nama || !jurusan || !email) {
                alert("Mohon lengkapi semua data pendaftaran!");
                return;
            }
  
            // Ubah tampilan tombol saat memproses data
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "Memproses...";
            submitBtn.disabled = true;
            submitBtn.classList.add("opacity-70", "cursor-not-allowed");
  
            const ticketID = generateTicketID();
  
            try {
                // Proses mengirim data ke Database (Koleksi: peserta_diesnatalis)
                await addDoc(collection(db, "peserta_diesnatalis"), {
                    nama_lengkap: nama,
                    jurusan: jurusan,
                    email: email,
                    kode_qr_unik: ticketID,
                    sumber_data: "pra_acara", 
                    waktu_hadir_pembukaan: null,
                    waktu_hadir_penutupan: null,
                    waktu_daftar: serverTimestamp()
                });
  
                // Simpan data sementara di Browser (Local Storage) 
                // Agar nanti bisa dibaca oleh halaman ticket.html
                localStorage.setItem("ticket_nama", nama);
                localStorage.setItem("ticket_jurusan", jurusan);
                localStorage.setItem("ticket_id", ticketID);
                localStorage.setItem("ticket_tipe", "Pra-Acara");
                
                // Lompat ke halaman tiket!
                window.location.href = "ticket.html";
                
            } catch (error) {
                console.error("Gagal menyimpan data: ", error);
                alert("Terjadi kesalahan sistem, silakan coba lagi.");
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
                submitBtn.classList.remove("opacity-70", "cursor-not-allowed");
            }
        });
    </script>
