<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Panitia - Dies Natalis FMIPA 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; }
        .ios-glass-panel {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%); border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }
        .ios-rounded { border-radius: 1.25rem; }
        
        #reader { width: 100% !important; border-radius: 1rem; overflow: hidden; border: none !important; }
        #reader video { width: 100% !important; max-height: 40vh; object-fit: cover; border-radius: 1rem; }
        #reader__dashboard_section_csr span { color: #64748b !important; font-family: 'Inter', sans-serif !important; }
        #reader__dashboard_section_swaplink { text-decoration: none !important; color: #3b82f6 !important; font-weight: 600; }
        button { border-radius: 0.75rem !important; }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center p-4 sm:p-5 relative overflow-hidden bg-gradient-to-br from-slate-100 via-white to-blue-50">
    
    <div class="fixed top-[-10%] left-[-10%] w-[250px] sm:w-[300px] h-[250px] sm:h-[300px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[60px] sm:blur-[80px] opacity-40"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[250px] sm:w-[300px] h-[250px] sm:h-[300px] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[60px] sm:blur-[80px] opacity-30"></div>

    <!-- Header Panitia dengan Tombol Kembali ke Portal -->
    <div class="w-full max-w-md flex justify-between items-center mb-4 sm:mb-6 mt-2 relative z-10">
        <div class="flex items-center gap-3">
            <a href="portal.html" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-600 hover:text-blue-600 transition-colors border border-slate-200">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 sm:w-5 sm:h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
            </a>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">Gate Access</h1>
                <p class="text-[10px] sm:text-xs font-medium text-slate-500 uppercase tracking-widest mt-0.5">Panitia Mode</p>
            </div>
        </div>
    </div>

    <div class="max-w-md w-full ios-glass-panel ios-rounded p-4 sm:p-6 relative z-10 flex flex-col items-center">
        
        <!-- Segmented Control (Switch Mode) -->
        <div class="w-full bg-slate-100/80 p-1 rounded-[0.8rem] flex mb-4 relative border border-slate-200/50">
            <button id="btn-pembukaan" onclick="switchMode('pembukaan')" class="flex-1 py-1.5 sm:py-2 text-[11px] sm:text-xs font-semibold rounded-lg bg-white shadow-sm text-blue-600 transition-all border border-slate-100">
                Mode Pembukaan
            </button>
            <button id="btn-penutupan" onclick="switchMode('penutupan')" class="flex-1 py-1.5 sm:py-2 text-[11px] sm:text-xs font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all border border-transparent">
                Mode Penutupan
            </button>
        </div>

        <div class="w-full bg-slate-100 rounded-[1rem] p-2 mb-3 sm:mb-4 border border-slate-200 shadow-inner">
            <div id="reader"></div>
        </div>

        <div class="w-full text-center">
            <div id="scan-status" class="inline-flex items-center gap-2 px-3 sm:px-4 py-1.5 sm:py-2 bg-blue-50 text-blue-600 rounded-full text-xs sm:text-sm font-semibold border border-blue-100 mb-2">
                <span class="relative flex h-2 w-2 sm:h-2.5 sm:w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 sm:h-2.5 sm:w-2.5 bg-blue-500"></span></span>
                Kamera Aktif...
            </div>
            <div id="scan-result" class="text-xs sm:text-sm font-medium text-slate-500 font-mono mt-1 sm:mt-2 break-all">
                Arahkan tiket ke kamera
            </div>
        </div>
    </div>

    <!-- Info Banner Mode Aktif -->
    <div id="mode-banner" class="max-w-md w-full mt-4 bg-blue-50 border border-blue-100 rounded-xl p-3 text-center relative z-10 shadow-sm transition-colors duration-300">
        <p class="text-[11px] sm:text-xs text-blue-700 font-semibold">Tugas Saat Ini: <span id="mode-text">Mencatat Kehadiran Pembukaan</span></p>
    </div>

    <div class="max-w-md w-full mt-4 grid grid-cols-2 gap-3 sm:gap-4 relative z-10 mb-12 sm:mb-8">
        <div class="ios-glass-panel rounded-2xl p-3 sm:p-4 flex flex-col items-center justify-center">
            <span class="text-[10px] sm:text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">Total Hadir</span>
            <span class="text-xl sm:text-2xl font-bold text-slate-900">0</span>
        </div>
        <div class="ios-glass-panel rounded-2xl p-3 sm:p-4 flex flex-col items-center justify-center">
            <span class="text-[10px] sm:text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">Scan Terakhir</span>
            <span class="text-xs sm:text-sm font-semibold text-emerald-600 truncate w-full text-center">-</span>
        </div>
    </div>

    <div class="absolute bottom-4 sm:bottom-6 w-full flex justify-center z-10 px-4">
        <p class="text-[9px] sm:text-[10px] text-slate-400/80 font-semibold tracking-[0.2em] uppercase text-center">© 2026 ATP Diesnatalis FMIPA</p>
    </div>

    <script>
        // Logika Switch Mode
        let currentMode = 'pembukaan'; 

        function switchMode(mode) {
            currentMode = mode;
            const btnPem = document.getElementById('btn-pembukaan');
            const btnPen = document.getElementById('btn-penutupan');
            const banner = document.getElementById('mode-banner');
            const modeText = document.getElementById('mode-text');

            if(mode === 'pembukaan') {
                btnPem.className = "flex-1 py-1.5 sm:py-2 text-[11px] sm:text-xs font-semibold rounded-lg bg-white shadow-sm text-blue-600 transition-all border border-slate-100";
                btnPen.className = "flex-1 py-1.5 sm:py-2 text-[11px] sm:text-xs font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all border border-transparent";
                banner.className = "max-w-md w-full mt-4 bg-blue-50 border border-blue-100 rounded-xl p-3 text-center relative z-10 shadow-sm transition-colors duration-300";
                banner.innerHTML = `<p class="text-[11px] sm:text-xs text-blue-700 font-semibold">Tugas Saat Ini: <span>Mencatat Kehadiran Pembukaan</span></p>`;
            } else {
                btnPen.className = "flex-1 py-1.5 sm:py-2 text-[11px] sm:text-xs font-semibold rounded-lg bg-white shadow-sm text-purple-600 transition-all border border-slate-100";
                btnPem.className = "flex-1 py-1.5 sm:py-2 text-[11px] sm:text-xs font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all border border-transparent";
                banner.className = "max-w-md w-full mt-4 bg-purple-50 border border-purple-100 rounded-xl p-3 text-center relative z-10 shadow-sm transition-colors duration-300";
                banner.innerHTML = `<p class="text-[11px] sm:text-xs text-purple-700 font-semibold">Tugas Saat Ini: <span>Mencatat Kehadiran Malam Puncak</span></p>`;
            }
        }

        // Logika Scanner
        document.addEventListener("DOMContentLoaded", function() {
            function onScanSuccess(decodedText, decodedResult) {
                html5QrcodeScanner.pause();
                const statusBadge = document.getElementById('scan-status');
                statusBadge.className = "inline-flex items-center gap-2 px-3 sm:px-4 py-1.5 sm:py-2 bg-emerald-50 text-emerald-600 rounded-full text-xs sm:text-sm font-semibold border border-emerald-100 mb-2";
                statusBadge.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3 sm:w-4 sm:h-4"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg> Scan Berhasil!`;
                
                // Nanti kita tambahkan logika Firebase di sini yang mengecek nilai `currentMode`
                document.getElementById('scan-result').innerText = "Mode: " + currentMode.toUpperCase() + " | ID: " + decodedText;

                setTimeout(() => {
                    html5QrcodeScanner.resume();
                    statusBadge.className = "inline-flex items-center gap-2 px-3 sm:px-4 py-1.5 sm:py-2 bg-blue-50 text-blue-600 rounded-full text-xs sm:text-sm font-semibold border border-blue-100 mb-2";
                    statusBadge.innerHTML = `<span class="relative flex h-2 w-2 sm:h-2.5 sm:w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 sm:h-2.5 sm:w-2.5 bg-blue-500"></span></span> Kamera Aktif...`;
                    document.getElementById('scan-result').innerText = "Arahkan tiket ke kamera";
                }, 2000);
            }

            function onScanFailure(error) {}

            let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 200, height: 200} }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        });
    </script>
</body>
</html>
