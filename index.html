<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Dinamika Gerak Translasi</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 10px; color: #bb86fc; }
        canvas {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 800px;
        }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.9em; margin-bottom: 5px; color: #aaa; }
        input[type="range"] { accent-color: #bb86fc; cursor: pointer; }
        .val-display { color: #03dac6; font-weight: bold; }
        .monitor {
            grid-column: span 2;
            background: #2c2c2c;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 1.1em;
            border-left: 4px solid #03dac6;
        }
        button {
            grid-column: span 2;
            padding: 12px;
            background: #bb86fc;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #9965f4; }
    </style>
</head>
<body>

    <h2>Simulasi Vektor Gaya & Hukum Newton</h2>
    <canvas id="simCanvas" width="800" height="350"></canvas>

    <div class="panel">
        <div class="input-group">
            <label>Massa Balok (m): <span id="valMass" class="val-display">10</span> kg</label>
            <input type="range" id="mass" min="1" max="50" value="10">
        </div>
        <div class="input-group">
            <label>Gaya Tarik (F): <span id="valForce" class="val-display">50</span> N</label>
            <input type="range" id="force" min="0" max="200" value="50">
        </div>
        <div class="input-group">
            <label>Sudut Tarikan (θ): <span id="valAngle" class="val-display">37</span>°</label>
            <input type="range" id="angle" min="0" max="90" value="37">
        </div>
        <div class="input-group">
            <label>Koefisien Gesek (μ): <span id="valMu" class="val-display">0.2</span></label>
            <input type="range" id="mu" min="0" max="1" step="0.1" value="0.2">
        </div>
        
        <div class="monitor">
            <span>N = <span id="outN">0</span> N</span>
            <span>Fx = <span id="outFx">0</span> N</span>
            <span>f = <span id="outFk">0</span> N</span>
            <span style="color: #bb86fc;">a = <span id="outA">0</span> m/s²</span>
        </div>

        <button id="btnPlay">Mulai Simulasi</button>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Referensi UI
        const inputs = ['mass', 'force', 'angle', 'mu'];
        const vals = {};
        inputs.forEach(id => {
            vals[id] = document.getElementById(id);
            vals[id].addEventListener('input', (e) => {
                document.getElementById('val' + id.charAt(0).toUpperCase() + id.slice(1)).innerText = e.target.value;
                resetSim();
            });
        });

        const btnPlay = document.getElementById('btnPlay');
        let isPlaying = false;
        let animationId;

        // Variabel Fisika
        const g = 10;
        let xPos = 100;
        let velocity = 0;
        let lastTime = 0;

        function drawArrow(fromx, fromy, tox, toy, color, label) {
            const headlen = 10; 
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            ctx.fillStyle = color;
            ctx.font = "14px Arial";
            ctx.fillText(label, tox + 5, toy - 5);
        }

        function render(dt) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Lantai
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 250, canvas.width, 100);

            const m = parseFloat(vals.mass.value);
            const F = parseFloat(vals.force.value);
            const theta = parseFloat(vals.angle.value) * Math.PI / 180;
            const mu = parseFloat(vals.mu.value);

            // Kalkulasi Vektor
            const w = m * g;
            const Fx = F * Math.cos(theta);
            const Fy = F * Math.sin(theta);
            
            let N = w - Fy;
            let status = "";
            let a = 0;
            let fk = 0;

            if (N <= 0) {
                N = 0;
                status = "Benda Terangkat!";
                // Logika dasar jika terangkat
            } else {
                fk = mu * N;
                const F_net = Fx - fk;
                if (F_net > 0) {
                    a = F_net / m;
                } else {
                    fk = Fx; // Gaya gesek statis menahan
                    a = 0;
                }
            }

            // Update Monitor
            document.getElementById('outN').innerText = N.toFixed(1);
            document.getElementById('outFx').innerText = Fx.toFixed(1);
            document.getElementById('outFk').innerText = fk.toFixed(1);
            document.getElementById('outA').innerText = a.toFixed(2);

            // Update Posisi
            if (isPlaying && N > 0) {
                velocity += a * (dt / 1000) * 10; // Skala waktu agar terlihat
                xPos += velocity * (dt / 1000) * 10;
                if (xPos > canvas.width + 50) {
                    isPlaying = false;
                    btnPlay.innerText = "Mulai Simulasi";
                }
            }

            // Gambar Balok
            const rectW = 80, rectH = 60;
            const cy = 250 - rectH/2;
            const cx = xPos;
            
            ctx.fillStyle = "#03dac6";
            ctx.fillRect(cx - rectW/2, cy - rectH/2, rectW, rectH);

            // Gambar Vektor Gaya
            const scale = 1.5; // Skala panjang panah
            
            // W (ke bawah)
            drawArrow(cx, cy, cx, cy + w * scale, "#cf6679", "w");
            
            // N (ke atas)
            if (N > 0) drawArrow(cx, cy, cx, cy - N * scale, "#4caf50", "N");
            
            // F (miring)
            drawArrow(cx, cy, cx + Fx * scale, cy - Fy * scale, "#bb86fc", "F");
            
            // Fx (putus-putus komponen horizontal)
            ctx.setLineDash([5, 5]);
            drawArrow(cx, cy, cx + Fx * scale, cy, "#bb86fc", "Fx");
            ctx.setLineDash([]);
            
            // f (gesek)
            if (fk > 0) drawArrow(cx, 250, cx - fk * scale, 250, "#ffb74d", "f");
        }

        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            render(dt);
            animationId = requestAnimationFrame(gameLoop);
        }

        function resetSim() {
            xPos = 100;
            velocity = 0;
            isPlaying = false;
            btnPlay.innerText = "Mulai Simulasi";
        }

        btnPlay.addEventListener('click', () => {
            if (!isPlaying) {
                isPlaying = true;
                btnPlay.innerText = "Jeda";
            } else {
                isPlaying = false;
                btnPlay.innerText = "Lanjut";
            }
        });

        // Init
        requestAnimationFrame((timestamp) => {
            lastTime = timestamp;
            gameLoop(timestamp);
        });
    </script>
</body>
</html>
