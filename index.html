<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Kehadiran - Dies Natalis FMIPA 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f8fafc;
        }
        
        .ios-glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Menstandarkan rounded corners ala Apple (Squircle) */
        .ios-rounded {
            border-radius: 1.25rem; /* 20px */
        }
        
        /* Menghilangkan panah default dropdown */
        select {
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 relative overflow-hidden">
    
    <!-- Elemen Latar Belakang (Blurry Light) -->
    <div class="absolute top-[-15%] left-[-15%] w-[400px] h-[400px] bg-blue-600 rounded-full mix-blend-lighten filter blur-[128px] opacity-20"></div>
    <div class="absolute bottom-[-15%] right-[-15%] w-[400px] h-[400px] bg-emerald-600 rounded-full mix-blend-lighten filter blur-[128px] opacity-20"></div>

    <!-- Kotak Utama Registrasi -->
    <div class="max-w-md w-full ios-glass-panel ios-rounded p-9 shadow-2xl relative z-10 border border-white/5">
        
        <!-- Header -->
        <div class="mb-10 mt-2">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-1.5">Daftar Kehadiran</h1>
            <p class="text-sm font-medium text-slate-400">Dies Natalis FMIPA Unsoed ke-12</p>
        </div>

        <!-- Form Input -->
        <form class="space-y-5">
            <!-- Input Nama -->
            <div class="relative flex items-center">
                <span class="absolute left-4.5 text-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                </span>
                <input type="text" id="nama" class="w-full h-14 pl-13 bg-slate-800/60 ios-rounded border border-white/5 text-base text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500/50 focus:outline-none transition-all" placeholder="Nama Lengkap">
            </div>

            <!-- Input Jurusan -->
            <div class="relative flex items-center">
                <span class="absolute left-4.5 text-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.174L11.24 2.133a.75.75 0 0 1 1.107 0l6.98 8.041a.75.75 0 0 1-.577 1.25H4.837a.75.75 0 0 1-.577-1.25Z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 13.5v6a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5v-6" />
                    </svg>
                </span>
                <select id="jurusan" class="w-full h-14 pl-13 pr-6 bg-slate-800/60 ios-rounded border border-white/5 text-base text-white focus:ring-2 focus:ring-blue-500/50 focus:outline-none transition-all cursor-pointer">
                    <option value="" disabled selected class="text-slate-500">Pilih Program Studi</option>
                    <option value="Fisika" class="bg-slate-900">Fisika</option>
                    <option value="Kimia" class="bg-slate-900">Kimia</option>
                    <option value="Matematika" class="bg-slate-900">Matematika</option>
                </select>
                <span class="absolute right-4.5 text-slate-600 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                      <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                    </svg>
                </span>
            </div>

            <!-- Input Email -->
            <div class="relative flex items-center">
                <span class="absolute left-4.5 text-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                    </svg>
                </span>
                <input type="email" id="email" class="w-full h-14 pl-13 bg-slate-800/60 ios-rounded border border-white/5 text-base text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500/50 focus:outline-none transition-all" placeholder="Email Universitas (@mhs.unsoed.ac.id)">
            </div>

            <!-- Tombol Submit -->
            <button type="button" class="w-full h-14 bg-blue-600 text-white text-lg font-semibold ios-rounded hover:bg-blue-500 active:bg-blue-700 active:scale-[0.98] transition-all duration-150 mt-4 shadow-lg shadow-blue-900/40">
                Dapatkan E-Ticket
            </button>
            <p class="text-xs text-center text-slate-500 pt-2">Sudah mendaftar pra-acara? Tunjukkan kode Anda ke petugas.</p>
        </form>
    </div>
</body>
</html>
