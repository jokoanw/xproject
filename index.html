<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified E-Ticket - Dies Natalis FMIPA 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono&display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #020617; 
            color: #f8fafc;
        }
        
        .ios-glass-ticket {
            background: linear-gradient(170deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.6);
        }

        .ios-ticket-rounded {
            border-radius: 1.75rem; /* 28px */
        }
        
        /* Garis Pemisah ala iOS (halus dan terintegrasi) */
        .ios-divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%);
        }

        .mono-text {
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Ornamen Latar Belakang -->
    <div class="absolute top-[20%] left-[-10%] w-[350px] h-[350px] bg-indigo-700 rounded-full mix-blend-lighten filter blur-[120px] opacity-25"></div>
    <div class="absolute bottom-[20%] right-[-10%] w-[350px] h-[350px] bg-slate-600 rounded-full mix-blend-lighten filter blur-[120px] opacity-25"></div>

    <!-- Container Tiket -->
    <div class="max-w-sm w-full ios-glass-ticket ios-ticket-rounded overflow-hidden relative z-10 border border-white/5">
        
        <!-- Bagian Atas: Header & QR Code -->
        <div class="p-8 pb-7 flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-6">
                <span class="text-xl font-bold tracking-tight text-white">E-Ticket</span>
                <span class="px-3.5 py-1.5 bg-slate-800 text-slate-300 text-[11px] font-semibold tracking-wider uppercase ios-rounded border border-white/5">
                    Dies Natalis FMIPA 12
                </span>
            </div>
            
            <!-- Kotak QR Code dengan aksen iOS Green -->
            <div class="bg-white p-4 rounded-3xl shadow-xl mb-6 border-4 border-emerald-500/50 shadow-emerald-900/30">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=FMP12-VERIFIED-AFDHI&color=020617" alt="QR Code" class="w-44 h-44 object-contain rounded-xl">
            </div>
            
            <p class="text-green-400 font-semibold tracking-wide flex items-center gap-2.5 text-lg">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span>
                SIAP DI-SCAN
            </p>
        </div>

        <!-- Garis Pemisah Tiket -->
        <div class="ios-divider"></div>

        <!-- Bagian Bawah: Detail Peserta -->
        <div class="p-9 pt-7 bg-black/10">
            <div class="space-y-5">
                <div>
                    <p class="text-[11px] text-slate-500 uppercase tracking-widest mb-1.5">Nama Peserta</p>
                    <p class="font-semibold text-xl text-white">Afdhi Abdilah</p>
                </div>
                
                <div class="flex justify-between gap-4">
                    <div>
                        <p class="text-[11px] text-slate-500 uppercase tracking-widest mb-1.5">Program Studi</p>
                        <p class="font-medium text-base text-white">Fisika</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[11px] text-slate-500 uppercase tracking-widest mb-1.5">Tipe Tiket</p>
                        <p class="font-medium text-base text-white">On-The-Spot</p>
                    </div>
                </div>

                <div class="pt-2">
                    <p class="text-[11px] text-slate-500 uppercase tracking-widest mb-1.5">Ticket ID</p>
                    <p class="mono-text text-xs text-emerald-400 tracking-[0.2em]">FMP12-8A9X-21Z</p>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Instruksi bawah -->
    <p class="absolute bottom-10 text-sm text-slate-600 tracking-wide text-center w-full max-w-xs">Tunjukkan layar ini pada petugas di pintu masuk FMIPA.</p>
</body>
</html>
